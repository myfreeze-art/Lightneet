name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Pinned: ubuntu-latest is moving to a new image; 24.04 ships the Android SDK preinstalled.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Core tests (real libsodium)
        run: ./gradlew :core:jvmTest --console=plain 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}
      - name: App end-to-end test (Robolectric)
        run: ./gradlew :app:testDebugUnitTest --console=plain 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}
      - name: Lint and build
        run: ./gradlew :app:lintDebug :app:assembleDebug :app:assembleRelease --console=plain 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}
      - name: No network permission
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2
          ! "$AAPT2" dump permissions app/build/outputs/apk/release/app-release-unsigned.apk | grep -E "INTERNET|NETWORK"

      # Surface the end of the Gradle log as an annotation, visible without opening the logs.
      - name: Report failure
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, os, re, xml.etree.ElementTree as ET
          def emit(title, text):
              text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f"::error title={title}::{text[:6000]}")
          for f in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for bad in list(case.iter('failure')) + list(case.iter('error')):
                      body = (bad.get('message') or '') + '\n' + (bad.text or '')
                      emit(f"{case.get('classname')}.{case.get('name')}", '\n'.join(body.splitlines()[:40]))
          if os.path.exists('build.log'):
              lines = [l for l in open('build.log', errors='ignore') if re.match(r'^(e:|FAILURE|\* What went wrong|.*FAILED)', l)]
              emit('Gradle failure', ''.join(lines[-25:]))
          PY

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: reports
          path: |
            build.log
            core/build/reports/tests/
            app/build/reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lightneet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
