name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests (real libsodium)
        run: ./gradlew :core:jvmTest
      - name: App end-to-end test (Robolectric)
        run: ./gradlew :app:testDebugUnitTest
      - name: Lint and build
        run: ./gradlew :app:lintDebug :app:assembleDebug :app:assembleRelease
      - name: No network permission
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          ! "$AAPT2" dump permissions app/build/outputs/apk/release/app-release-unsigned.apk | grep -E "INTERNET|NETWORK"
      - uses: actions/upload-artifact@v4
        with:
          name: lightneet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
