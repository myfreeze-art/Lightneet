name: Release

# Push a tag like v0.1.0 → tests run, a release APK is built, signed and published
# on the Releases page together with its SHA-256 checksum.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          # A release must never be built from a cache another workflow could have written.
          cache-disabled: true

      - name: Version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 1.2.3 → 10203 (prerelease suffixes are ignored for the code)
          CORE="${VERSION%%-*}"
          IFS=. read -r MA MI PA <<< "$CORE"
          echo "LIGHTNEET_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "LIGHTNEET_VERSION_CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))" >> "$GITHUB_ENV"

      - name: Signing mode
        env:
          HAS_KEY: ${{ secrets.LIGHTNEET_KEYSTORE_BASE64 != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "SIGNED_WITH=release" >> "$GITHUB_ENV"
          else
            echo "::warning::No release key configured (see docs/RELEASING.md). Building a PREVIEW signed with a throwaway debug key."
            echo "LIGHTNEET_DEBUG_SIGNED=1" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=debug" >> "$GITHUB_ENV"
          fi

      - name: Tests
        run: ./gradlew :core:jvmTest :app:testDebugUnitTest --console=plain 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      # The signing key exists on disk only for the duration of this one step, and only
      # first-party code (Gradle + our build) runs while it does.
      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.LIGHTNEET_KEYSTORE_BASE64 }}
          LIGHTNEET_KEYSTORE_PASSWORD: ${{ secrets.LIGHTNEET_KEYSTORE_PASSWORD }}
          LIGHTNEET_KEY_ALIAS: ${{ secrets.LIGHTNEET_KEY_ALIAS }}
          LIGHTNEET_KEY_PASSWORD: ${{ secrets.LIGHTNEET_KEY_PASSWORD }}
        run: |
          if [ "$SIGNED_WITH" = "release" ]; then
            export LIGHTNEET_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            trap 'shred -u "$LIGHTNEET_KEYSTORE_FILE" 2>/dev/null || rm -f "$LIGHTNEET_KEYSTORE_FILE"' EXIT
            umask 077
            echo "$KEYSTORE_BASE64" | base64 -d > "$LIGHTNEET_KEYSTORE_FILE"
          fi
          ./gradlew :app:assembleRelease --no-daemon --console=plain 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Verify and collect
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee signer.txt
          if "$BT/aapt2" dump permissions "$APK" | grep -E "INTERNET|NETWORK"; then
            echo "::error::Network permission found in the APK"; exit 1
          fi
          OUT="Lightneet-${LIGHTNEET_VERSION_NAME}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"
          echo "CERT_SHA256=$(grep 'SHA-256 digest' signer.txt | head -1 | awk '{print $NF}')" >> "$GITHUB_ENV"

      - name: Release notes
        run: |
          {
            echo "## Lightneet ${LIGHTNEET_VERSION_NAME}"
            echo
            if [ "$SIGNED_WITH" = "debug" ]; then
              echo "> ⚠️ **Предварительная сборка.** Подписана временным ключом. Следующие версии с другим ключом нельзя будет установить поверх — понадобится удалить приложение, **а вместе с ним и всё хранилище**. Не храните здесь единственные копии важных файлов."
              echo
            fi
            echo "**Установка:** скачайте \`${APK_NAME}\`, откройте его на телефоне и разрешите установку из этого источника. Android 9+."
            echo
            echo "**Проверка подлинности:**"
            echo '```'
            cat "${APK_NAME}.sha256"
            echo "Сертификат подписи SHA-256: ${CERT_SHA256}"
            echo '```'
            echo
            echo "Приложение не запрашивает доступ в интернет. Формат хранения: [SPEC.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/SPEC.md), модель угроз: [THREAT_MODEL.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/THREAT_MODEL.md)."
          } > notes.md

      - name: Report failure
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, os, re, xml.etree.ElementTree as ET
          def emit(title, text):
              text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f"::error title={title}::{text[:6000]}")
          for f in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for bad in list(case.iter('failure')) + list(case.iter('error')):
                      body = (bad.get('message') or '') + '\n' + (bad.text or '')
                      emit(f"{case.get('classname')}.{case.get('name')}", '\n'.join(body.splitlines()[:40]))
          if os.path.exists('build.log'):
              lines = [l for l in open('build.log', errors='ignore') if re.match(r'^(e:|FAILURE|\* What went wrong|.*FAILED)', l)]
              emit('Gradle failure', ''.join(lines[-25:]))
          PY

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Lightneet ${{ env.LIGHTNEET_VERSION_NAME }}
          body_path: notes.md
          prerelease: ${{ env.SIGNED_WITH == 'debug' || contains(github.ref_name, '-') }}
          files: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
